version: 2
updates:
  # Auto-bumps the .dsh-plugin-kit submodule pointer whenever
  # OneZero-Y/dsh-plugin-kit's default branch moves — opens a PR here
  # instead of requiring a manual `git submodule update --remote` +
  # commit + push cycle.
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "daily"
    # GitHub applies a default 3-day cooldown to version updates as of the
    # 2026-07-14 platform change (a fresh commit on dsh-plugin-kit's default
    # branch is ignored until it's 3 days old, even after a manual "Check
    # for updates"). This kit is actively developed and its fixes are meant
    # to reach this plugin quickly, not wait out a security-vendor-review
    # window meant for public package registries — set to 0 to disable it
    # for this submodule specifically.
    cooldown:
      default-days: 0
